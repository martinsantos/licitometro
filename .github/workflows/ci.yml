name: CI Checks

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

# Cancel in-progress CI runs for the same PR
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    name: Lint & Build Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'  # Match Dockerfile.nginx (node:20-alpine)
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Run frontend tests
        working-directory: frontend
        run: npm test -- --watchAll=false --passWithNoTests

      - name: Build frontend
        working-directory: frontend
        run: npm run build
        env:
          CI: true
          REACT_APP_BACKEND_URL: ""

      - name: Run E2E smoke tests
        working-directory: frontend
        run: npm run e2e:smoke:ci
        env:
          CI: true
          REACT_APP_BACKEND_URL: ""

      - name: Verify build artifacts
        working-directory: frontend
        run: |
          if [ ! -d "build" ]; then
            echo "Build directory not found"
            exit 1
          fi
          if [ ! -f "build/index.html" ]; then
            echo "index.html not found in build"
            exit 1
          fi
          echo "Build artifacts verified"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check Python syntax
        working-directory: backend
        run: |
          python -m py_compile server.py
          # Check all scrapers and services too
          find scrapers services routers utils models db -name "*.py" | xargs python -m py_compile
          echo "Python syntax check passed (server + all modules)"

      - name: Lint backend (flake8)
        working-directory: backend
        run: flake8 .

  test-backend:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Run backend unit tests
        run: pytest tests backend/tests -v
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
